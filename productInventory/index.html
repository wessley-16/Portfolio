<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Product Inventory Manager</h1>
        <form id="inventoryForm">
            <div id="form-group">
                <label>Product Name:</label>
                <input type="text" id="productName"><br><br>

                <label>Quantity:</label>
                <input type="number" id="quantity"><br><br>

                <label>Price:</label>
                <input type="number" id="price" step="0.01"><br><br>
            </div>

            <div id="buttonGroup">
                <button type="button" onclick="addProduct()">Add Item</button>
                <button type="button" onclick="deleteProduct()">Delete Item</button>
                <button type="button" onclick="updateProduct()">Update Item</button>
                <button type="button" onclick="searchProduct()">Search Item</button>
            </div>
        </form>

        <div class="search-results" id="searchResultsContainer">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Search Result</h2>
                <button class="close-search" id="closeSearchBtn" onclick="hideSearchResults()" aria-label="Close search results">X</button>
            </div>
            
            <table border="1" id="hiddenSearchTable">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th class="search-total-header">
                            Total Value
                        </th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <h2>Inventory Table</h2>
        <table border="1" id="inventoryTable">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total Value</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
